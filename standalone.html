        status.style.color = '#c00';

    // Progress updates
    function setStatus(msg) {
      var s = document.getElementById('status');

      { id: 'tui-sicilie-villa', title: 'Villa Taormina privezwembad', destination: 'Sicilie', country: 'Italie', region: 'Taormina', provider: 'TUI', providerUrl: 'https://www.tui.nl/p/vakantie/italie/sicilie/', type: 'villa', pricePerPerson: 800, duration: 11, startDate: '2026-07-01', flightTime: '3h', inclusions: ['vlucht', 'transfer', 'verblijf', 'privezwembad'], catering: 'logies', ratings: { sun: 5, food: 5, culture: 5, pool: 5 }, rating: 8.8, keywords: ['villa', 'privezwembad', 'cultuur', 'eten'], description: 'Luxe villa met privezwembad en Etna-zicht. Net binnen budget.', highlights: ['Etna vulkaan', 'Grieks theater', 'Privezwembad', 'Foodie paradijs'] }
    ];

    console.log('[VakantieDashboard] Loaded', deals.length, 'deals');

    // Keyword categories - using simple emojis to avoid encoding issues
    const keywordCategories = [
      { label: 'Type', items: [
        { id: 'villa', icon: '🏡' },
        { id: 'appartement', icon: '🏢' },
        { id: 'hotel', icon: '🏨' },
        { id: 'aparthotel', icon: '🏬' },
        { id: 'all-inclusive', icon: '🍹' }
      ]},
      { label: 'Faciliteiten', items: [
        { id: 'privezwembad', icon: '🏊' },
        { id: 'huurauto-inclusief', icon: '🚗' },
        { id: 'strand', icon: '🏖️' }
      ]},
      { label: 'Sfeer', items: [
        { id: 'rustig', icon: '🌿' },
        { id: 'levendig', icon: '🎉' },
        { id: 'kleinschalig', icon: '🏘️' },
        { id: 'luxe', icon: '⭐' },
        { id: 'budget', icon: '💸' },
        { id: 'familie', icon: '👨' }
      ]},
      { label: 'Interesses', items: [
        { id: 'cultuur', icon: '🏛️' },
        { id: 'eten', icon: '🍝' },
        { id: 'historisch', icon: '⛩️' },
        { id: 'natuur', icon: '🌲' },
        { id: 'duiken', icon: '🤿' }
      ]}
    ];

    // ============= MAIN APP =============
    function App() {
      const [maxBudget, setMaxBudget] = useState(800);
      const [travelers, setTravelers] = useState(3);
      const [selectedKeywords, setSelectedKeywords] = useState([]);
      const [selectedProviders, setSelectedProviders] = useState([]);
      const [selectedCountries, setSelectedCountries] = useState([]);
      const [showOverBudget, setShowOverBudget] = useState(false);
      const [sortBy, setSortBy] = useState('price-asc');

      const allProviders = useMemo(function() {
        const set = {};
        deals.forEach(function(d) { set[d.provider] = true; });
        return Object.keys(set);
      }, []);

      const allCountries = useMemo(function() {
        const set = {};
        deals.forEach(function(d) { set[d.country] = true; });
        return Object.keys(set);
      }, []);

      function toggleInArray(item, arr, setArr) {
        if (arr.indexOf(item) >= 0) {
          setArr(arr.filter(function(x) { return x !== item; }));
        } else {
          setArr(arr.concat([item]));
        }
      }

      function resetAll() {
        setSelectedKeywords([]);
        setSelectedProviders([]);
        setSelectedCountries([]);
        setMaxBudget(800);
        setTravelers(3);
        setSortBy('price-asc');
        setShowOverBudget(false);
      }

      const filtered = useMemo(function() {
        let r = deals.slice();
        if (!showOverBudget) r = r.filter(function(d) { return d.pricePerPerson <= maxBudget; });
        if (selectedKeywords.length > 0) {
          r = r.filter(function(d) {
            return selectedKeywords.every(function(k) { return d.keywords.indexOf(k) >= 0; });
          });
        }
        if (selectedProviders.length > 0) {
          r = r.filter(function(d) { return selectedProviders.indexOf(d.provider) >= 0; });
        }
        if (selectedCountries.length > 0) {
          r = r.filter(function(d) { return selectedCountries.indexOf(d.country) >= 0; });
        }

        if (sortBy === 'price-asc') r.sort(function(a,b) { return a.pricePerPerson - b.pricePerPerson; });
        else if (sortBy === 'price-desc') r.sort(function(a,b) { return b.pricePerPerson - a.pricePerPerson; });
        else if (sortBy === 'rating-desc') r.sort(function(a,b) { return b.rating - a.rating; });
        else if (sortBy === 'flight-asc') {
          r.sort(function(a,b) {
            function pt(t) {
              const m = t.match(/(\d+)h\s*(\d+)?/);
              return m ? parseInt(m[1],10)*60 + (parseInt(m[2],10)||0) : 999;
            }
            return pt(a.flightTime) - pt(b.flightTime);
          });
        }
        else if (sortBy === 'duration-desc') r.sort(function(a,b) { return b.duration - a.duration; });

        return r;
      }, [maxBudget, selectedKeywords, selectedProviders, selectedCountries, sortBy, showOverBudget]);

      const cheapest = deals.reduce(function(m, d) {
        return d.pricePerPerson < m.pricePerPerson ? d : m;
      }, deals[0]);
      const withinBudget = deals.filter(function(d) { return d.pricePerPerson <= maxBudget; }).length;

      return (
        <div className="min-h-screen bg-slate-50">
          <header className="bg-blue-600 text-white py-6 shadow-lg">
            <div className="container mx-auto px-4 max-w-7xl">
              <h1 className="text-2xl md:text-3xl font-bold">🏖️ Vakantie Deals Dashboard</h1>
              <p className="text-blue-100 text-sm mt-1">1-12 juli 2026 • Amsterdam Schiphol • {travelers} personen</p>
            </div>
          </header>

          <main className="container mx-auto px-4 py-6 max-w-7xl">
            <div className="bg-blue-600 text-white rounded-xl p-4 mb-6 shadow">
              <div className="grid grid-cols-2 md:grid-cols-4 gap-3 text-center">
                <div><p className="text-xs uppercase opacity-90">Deals</p><p className="text-2xl font-bold">{deals.length}</p></div>
                <div><p className="text-xs uppercase opacity-90">Binnen budget</p><p className="text-2xl font-bold">{withinBudget}</p></div>
                <div><p className="text-xs uppercase opacity-90">Goedkoopste</p><p className="text-2xl font-bold">€{cheapest.pricePerPerson}</p></div>
                <div><p className="text-xs uppercase opacity-90">Resultaten</p><p className="text-2xl font-bold">{filtered.length}</p></div>
              </div>
            </div>

            <div className="bg-white rounded-xl p-4 shadow mb-4">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <div className="flex justify-between mb-2">
                    <label className="font-semibold text-gray-700 text-sm">💰 Max budget per persoon</label>
                    <span className="text-xl font-bold text-blue-600">€{maxBudget}</span>
                  </div>
                  <input
                    type="range" min="300" max="1500" step="25"
                    value={maxBudget}
                    onChange={function(e) { setMaxBudget(Number(e.target.value)); }}
                    className="w-full h-2 bg-blue-200 rounded-lg appearance-none cursor-pointer"
                  />
                  <p className="text-xs text-gray-600 mt-2">
                    Totaal {travelers}p: <strong className="text-blue-600">€{maxBudget * travelers}</strong>
                  </p>
                </div>
                <div>
                  <div className="flex justify-between mb-2">
                    <label className="font-semibold text-gray-700 text-sm">👥 Reizigers</label>
                    <span className="text-xl font-bold text-orange-600">{travelers}</span>
                  </div>
                  <div className="flex gap-1">
                    {[1,2,3,4,5,6].map(function(n) {
                      return (
                        <button
                          key={n}
                          onClick={function() { setTravelers(n); }}
                          className={'flex-1 py-2 rounded font-semibold text-sm ' + (travelers === n ? 'bg-orange-500 text-white' : 'bg-gray-100 text-gray-700')}
                        >{n}</button>
                      );
                    })}
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-xl p-4 shadow mb-4">
              <div className="flex justify-between mb-3">
                <h2 className="font-bold text-gray-800">🏷️ Keywords ({selectedKeywords.length})</h2>
                {selectedKeywords.length > 0 && (
                  <button onClick={function() { setSelectedKeywords([]); }} className="text-xs text-red-600">Reset</button>
                )}
              </div>
              <div className="space-y-3">
                {keywordCategories.map(function(cat) {
                  return (
                    <div key={cat.label}>
                      <p className="text-xs font-semibold text-gray-500 uppercase mb-1">{cat.label}</p>
                      <div className="flex flex-wrap gap-1">
                        {cat.items.map(function(kw) {
                          const isSelected = selectedKeywords.indexOf(kw.id) >= 0;
                          return (
                            <button
                              key={kw.id}
                              onClick={function() { toggleInArray(kw.id, selectedKeywords, setSelectedKeywords); }}
                              className={'px-3 py-1 rounded-full text-xs font-medium ' + (isSelected ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-700')}
                            >{kw.icon} {kw.id}</button>
                          );
                        })}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="bg-white rounded-xl p-4 shadow mb-4">
              <div className="grid grid-cols-1 md:grid-cols-3 gap-3 mb-3">
                <div>
                  <label className="text-xs font-semibold text-gray-700 mb-1 block">Sorteer</label>
                  <select
                    value={sortBy}
                    onChange={function(e) { setSortBy(e.target.value); }}
                    className="w-full p-2 border border-gray-300 rounded text-sm bg-white"
                  >
                    <option value="price-asc">💰 Prijs (laag-hoog)</option>
                    <option value="price-desc">💎 Prijs (hoog-laag)</option>
                    <option value="rating-desc">⭐ Beoordeling</option>
                    <option value="flight-asc">✈️ Vluchttijd</option>
                    <option value="duration-desc">📅 Reisduur</option>
                  </select>
                </div>
                <div>
                  <label className="text-xs font-semibold text-gray-700 mb-1 block">Provider</label>
                  <div className="flex flex-wrap gap-1">
                    {allProviders.map(function(p) {
                      const sel = selectedProviders.indexOf(p) >= 0;
                      return (
                        <button
                          key={p}
                          onClick={function() { toggleInArray(p, selectedProviders, setSelectedProviders); }}
                          className={'px-2 py-1 rounded text-xs ' + (sel ? 'bg-purple-600 text-white' : 'bg-gray-100')}
                        >{p}</button>
                      );
                    })}
                  </div>
                </div>
                <div>
                  <label className="text-xs font-semibold text-gray-700 mb-1 block">Land</label>
                  <div className="flex flex-wrap gap-1">
                    {allCountries.map(function(c) {
                      const sel = selectedCountries.indexOf(c) >= 0;
                      return (
                        <button
                          key={c}
                          onClick={function() { toggleInArray(c, selectedCountries, setSelectedCountries); }}
                          className={'px-2 py-1 rounded text-xs ' + (sel ? 'bg-green-600 text-white' : 'bg-gray-100')}
                        >{c}</button>
                      );
                    })}
                  </div>
                </div>
              </div>
              <div className="flex justify-between items-center pt-3 border-t">
                <p className="text-xs">
                  <span className="font-bold text-green-600">{filtered.length}</span>
                  <span className="text-gray-600"> van {deals.length}</span>
                </p>
                <button onClick={resetAll} className="text-xs text-red-600 font-medium">🔄 Reset alles</button>
              </div>
            </div>

            <div className="mb-4">
              <label className="inline-flex items-center bg-white rounded-lg px-3 py-2 shadow text-sm">
                <input
                  type="checkbox"
                  checked={showOverBudget}
                  onChange={function(e) { setShowOverBudget(e.target.checked); }}
                  className="mr-2 h-4 w-4 text-blue-600"
                />
                <span className="text-gray-700">Toon ook deals boven budget</span>
              </label>
            </div>

            {filtered.length === 0 ? (
              <div className="bg-white rounded-xl p-8 text-center shadow">
                <p className="text-3xl mb-2">😔</p>
                <p className="text-lg font-bold text-gray-700 mb-2">Geen deals gevonden</p>
                <p className="text-sm text-gray-600 mb-4">Probeer minder keywords of hoger budget.</p>
                <button onClick={resetAll} className="bg-blue-600 text-white px-4 py-2 rounded text-sm">Reset filters</button>
              </div>
            ) : (
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                {filtered.map(function(deal) {
                  return <DealCard key={deal.id} deal={deal} maxBudget={maxBudget} travelers={travelers} />;
                })}
              </div>
            )}
          </main>

          <footer className="bg-slate-900 text-slate-300 py-6 mt-8">
            <div className="container mx-auto px-4 max-w-7xl text-center text-xs">
              <p>💡 Prijzen zijn schattingen gebaseerd op publieke info van TUI, Sunweb, Corendon, ByJune (mei 2026).</p>
              <p className="mt-1">🔗 Klik op een deal voor echte zoekopdracht bij provider.</p>
            </div>
          </footer>
        </div>
      );
    }

    // ============= DEAL CARD =============
    function DealCard(props) {
      const deal = props.deal;
      const maxBudget = props.maxBudget;
      const travelers = props.travelers;
      const [expanded, setExpanded] = useState(false);

      const totalPrice = deal.pricePerPerson * travelers;
      const within = deal.pricePerPerson <= maxBudget;
      const margin = maxBudget - deal.pricePerPerson;

      function stars(n) {
        let s = '';
        for (let i = 0; i < 5; i++) s += i < n ? '●' : '○';
        return s;
      }

      const typeStyles = {
        'villa': 'bg-green-100 text-green-800',
        'appartement': 'bg-blue-100 text-blue-800',
        'hotel': 'bg-purple-100 text-purple-800',
        'aparthotel': 'bg-indigo-100 text-indigo-800',
        'all-inclusive': 'bg-orange-100 text-orange-800'
      };
      const providerColors = {
        'TUI': 'bg-blue-600',
        'Sunweb': 'bg-yellow-500',
        'Corendon': 'bg-red-600',
        'ByJune': 'bg-purple-600'
      };

      return (
        <div className={'bg-white rounded-xl shadow overflow-hidden border-2 ' + (within ? 'border-green-200' : 'border-red-200 opacity-75')}>
          <div className={'p-3 ' + (within ? 'bg-blue-50' : 'bg-red-50')}>
            <div className="flex justify-between mb-2">
              <span className={(providerColors[deal.provider] || 'bg-gray-600') + ' text-white text-xs font-bold px-2 py-1 rounded'}>{deal.provider}</span>
              <span className={'px-2 py-1 rounded-full text-xs font-semibold ' + (typeStyles[deal.type] || 'bg-gray-100')}>{deal.type}</span>
            </div>
            <h3 className="text-base font-bold text-gray-900">{deal.title}</h3>
            <p className="text-xs text-gray-600 mt-1">📍 {deal.region}, {deal.country}</p>
            <p className="text-xs text-gray-500">✈️ {deal.flightTime} vanaf Amsterdam</p>
          </div>

          <div className={'px-3 py-2 ' + (within ? 'bg-green-50' : 'bg-red-50') + ' border-b'}>
            <div className="flex justify-between items-end">
              <div>
                <p className="text-xs text-gray-600">per persoon</p>
                <p className={'text-xl font-bold ' + (within ? 'text-green-700' : 'text-red-700')}>€{deal.pricePerPerson}</p>
              </div>
              <div className="text-right">
                <p className="text-xs text-gray-600">{travelers}p totaal</p>
                <p className="text-base font-bold">€{totalPrice}</p>
              </div>
              {within
                ? <div className="bg-green-200 text-green-900 text-xs px-2 py-1 rounded font-bold">€{margin} marge</div>
                : <div className="bg-red-200 text-red-900 text-xs px-2 py-1 rounded font-bold">€{Math.abs(margin)} over</div>}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-2 px-3 py-2 text-xs border-b">
            <div><span className="text-gray-500">Duur:</span> <strong>{deal.duration}d</strong></div>
            <div><span className="text-gray-500">Score:</span> <strong>{deal.rating}/10</strong></div>
            <div><span className="text-gray-500">Verzorging:</span> <strong className="capitalize">{deal.catering}</strong></div>
            <div><span className="text-gray-500">Vertrek:</span> <strong>{deal.startDate}</strong></div>
          </div>

          <div className="px-3 py-2 border-b">
            <p className="text-xs text-gray-700">{deal.description}</p>
          </div>

          <div className="px-3 py-2 border-b bg-gray-50">
            <div className="flex flex-wrap gap-1">
              {deal.inclusions.map(function(inc) {
                return <span key={inc} className="text-xs bg-white border px-2 py-0.5 rounded-full">✓ {inc}</span>;
              })}
            </div>
          </div>

          <div className="grid grid-cols-2 gap-1 px-3 py-2 text-xs border-b">
            <div>☀️ <span className="text-yellow-500">{stars(deal.ratings.sun)}</span></div>
            <div>🍽️ <span className="text-yellow-500">{stars(deal.ratings.food)}</span></div>
            <div>🏛️ <span className="text-yellow-500">{stars(deal.ratings.culture)}</span></div>
            <div>🏊 <span className="text-yellow-500">{stars(deal.ratings.pool)}</span></div>
          </div>

          <div className="px-3 py-2 border-b">
            <div className="flex flex-wrap gap-1">
              {deal.keywords.map(function(k) {
                return <span key={k} className="text-xs bg-blue-100 text-blue-800 px-2 py-0.5 rounded">{k}</span>;
              })}
            </div>
          </div>

          <button onClick={function() { setExpanded(!expanded); }} className="w-full px-3 py-1 text-xs text-blue-600 hover:bg-blue-50">
            {expanded ? '↑ Verberg' : '↓ Toon highlights'}
          </button>

          {expanded && (
            <div className="px-3 py-2 border-t bg-blue-50 text-xs">
              <p className="text-gray-600 mb-1 font-semibold">Hoogtepunten:</p>
              <ul className="space-y-0.5">
                {deal.highlights.map(function(h, i) {
                  return <li key={i}>▸ {h}</li>;
                })}
              </ul>
            </div>
          )}

          <div className="p-2 bg-blue-600">
            <a
              href={deal.providerUrl}
              target="_blank"
              rel="noopener noreferrer"
              className="block w-full bg-white text-blue-600 text-center font-bold py-1.5 rounded text-sm hover:bg-blue-50"
            >🔗 Bekijk op {deal.provider}.nl →</a>
          </div>
        </div>
      );
    }

    // ============= MOUNT =============
    console.log('[VakantieDashboard] Mounting React app...');
    try {
      const container = document.getElementById('root');
      const root = ReactDOM.createRoot(container);
      root.render(
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      );
      console.log('[VakantieDashboard] React mounted successfully!');
    } catch (e) {
      console.error('[VakantieDashboard] Mount failed:', e);
      document.getElementById('root').innerHTML =
        '<div class="error-box"><h2>⚠️ Mount Error</h2><pre>' + (e.message || String(e)) + '</pre></div>';
    }
  </script>
</body>
</html>
